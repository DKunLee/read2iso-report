<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>From Reads to Isoform Dynamics</title>
  <meta name="description" content="A differentiable approach to joint transcript quantification across time.">
  <style>
    :root {
      --bg: #fbfaf7;
      --text: #1f2328;
      --muted: #59636e;
      --rule: #d8d4cc;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16181c;
        --text: #e6e6e3;
        --muted: #a3a8af;
        --rule: #3a3e45;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 16px;
      background: var(--bg);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
    }
    main {
      max-width: 40rem;
      text-align: center;
    }
    h1 {
      margin: 0 0 1rem;
      font-size: clamp(2rem, 6vw, 3.25rem);
      font-weight: 600;
      line-height: 1.15;
    }
    p {
      margin: 0 auto;
      padding-top: 1rem;
      border-top: 1px solid var(--rule);
      color: var(--muted);
      font-size: clamp(1.05rem, 2.6vw, 1.3rem);
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main>
    <h1>From Reads to Isoform Dynamics</h1>
    <p>A differentiable approach to joint transcript quantification across time</p>
  </main>
</body>
</html>
